name: PIKE Modular Azure Infrastructure Deployment

on:
  workflow_dispatch:
    inputs:
      deploy_resources:
        description: "Deploy Azure resources after validation and What-If"
        required: true
        type: boolean
        default: false

  push:
    branches:
      - dev
    paths:
      - "modules/**"
      - "input.json"
      - "bicepconfig.json"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  actions: read
  security-events: write

env:
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:

  # JOB 1: BICEP LINT
  bicep-lint:
    name: Bicep Lint and Build
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Azure Bicep
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          az bicep install
          az bicep version

      - name: Validate Bicep configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path "bicepconfig.json")) {
            throw "bicepconfig.json not found."
          }
          $files = @(Get-ChildItem modules -Recurse -Filter "*.bicep")
          if ($files.Count -eq 0) {
            throw "No Bicep modules found."
          }
          foreach ($file in $files) {
            Write-Host "Building and linting $($file.FullName)"
            az bicep build --file $file.FullName --stdout | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "Bicep build/lint failed: $($file.Name)"
            }
          }
          Write-Host "Bicep validation completed."

  # JOB 2: CODEQL SECURITY SCAN
  codeql:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: actions
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:actions"

  # JOB 3: INPUT VALIDATION AND PARAMETER GENERATION
  validate-input:
    name: Input Validation
    runs-on: [self-hosted, Windows, X64]
    needs:
      - bicep-lint
      - codeql
    outputs:
      rg_name: ${{ steps.validate.outputs.rg_name }}
      location: ${{ steps.validate.outputs.location }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate input.json and generate parameters
        id: validate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $config = Get-Content "input.json" -Raw | ConvertFrom-Json

          if ($config.request.approved -ne $true) {
            throw "Request is not approved."
          }
          if ($config.request.deploymentMethod -ne "Bicep") {
            throw "Deployment method must be Bicep."
          }
          if ($config.subscription.subscriptionId -ne $env:AZURE_SUBSCRIPTION_ID) {
            throw "Subscription ID in input.json does not match GitHub secret."
          }

          $rg = $config.landingZones.resourceGroups
          if (@($rg).Count -ne 1) {
            throw "This workflow currently expects exactly one resource group."
          }

          $rgName = $rg[0].rgName
          $location = $config.deployment.location
          if ([string]::IsNullOrWhiteSpace($rgName)) {
            throw "Resource group name is missing."
          }
          if ([string]::IsNullOrWhiteSpace($location)) {
            throw "Deployment location is missing."
          }

          "rg_name=$rgName" >> $env:GITHUB_OUTPUT
          "location=$location" >> $env:GITHUB_OUTPUT

          New-Item -ItemType Directory -Force -Path ".generated-parameters" | Out-Null

          function Save-Parameters {
            param([string]$FileName, [hashtable]$Values)
            $parameters = @{}
            foreach ($key in $Values.Keys) {
              $parameters[$key] = @{ value = $Values[$key] }
            }
            @{
              '$schema' = "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#"
              contentVersion = "1.0.0.0"
              parameters = $parameters
            } | ConvertTo-Json -Depth 100 |
              Set-Content ".generated-parameters/$FileName.json"
          }

          # Resource Group
          foreach ($x in $config.landingZones.resourceGroups) {
            Save-Parameters "resourcegroup" @{
              rgname = $x.rgName
              location = $x.location
              tags = $x.tags
            }
          }

          # NSG
          foreach ($x in $config.landingZones.nsgs) {
            Save-Parameters "nsg" @{
              location = $x.location
              nsgName = $x.name
              securityRules = @($x.securityRules)
              tags = $x.tags
            }
          }

          # Route Table
          foreach ($x in $config.landingZones.routeTables) {
            Save-Parameters "routetable" @{
              routeTableName = $x.name
              location = $x.location
              disableBgpRoutePropagation = $x.disableBgpRoutePropagation
              routes = @($x.routes)
              tags = $x.tags
            }
          }

          # VNet
          foreach ($x in $config.landingZones.vnets) {
            Save-Parameters "vnet" @{
              location = $x.location
              vnetName = $x.name
              addressPrefixes = @($x.addressPrefixes)
              tags = $x.tags
              dnsServers = @($x.dnsServers)
              subnets = @()
            }
          }

          # Subnet
          foreach ($x in $config.landingZones.subnets) {
            Save-Parameters "subnet" @{
              vnetName = $x.vnetName
              subnetName = $x.name
              addressPrefix = $x.addressPrefix
              networkSecurityGroupName = $x.networkSecurityGroupName
              routeTableName = $x.routeTableName
              serviceEndpoints = @($x.serviceEndpoints)
              privateEndpointNetworkPolicies = $x.privateEndpointNetworkPolicies
              privateLinkServiceNetworkPolicies = $x.privateLinkServiceNetworkPolicies
            }
          }

          # Key Vault
          foreach ($x in $config.landingZones.keyVaults) {
            Save-Parameters "keyvault" @{
              keyVaultName = $x.name
              location = $x.location
              tenantId = $env:AZURE_TENANT_ID
              skuName = $x.skuName
              skuFamily = $x.skuFamily
              enableRbacAuthorization = $x.enableRbacAuthorization
              enablePurgeProtection = $x.enablePurgeProtection
              softDeleteRetentionInDays = $x.softDeleteRetentionInDays
              publicNetworkAccess = $x.publicNetworkAccess
              tags = $x.tags
            }
          }

          # Storage Account
          foreach ($x in $config.landingZones.storageAccounts) {
            Save-Parameters "storage" @{
              storageAccountName = $x.name
              location = $x.location
              tags = $x.tags
              skuName = $x.skuName
              kind = $x.kind
              accessTier = $x.accessTier
              minimumTlsVersion = $x.minimumTlsVersion
              supportsHttpsTrafficOnly = $x.supportsHttpsTrafficOnly
              allowBlobPublicAccess = $x.allowBlobPublicAccess
              allowSharedKeyAccess = $x.allowSharedKeyAccess
              publicNetworkAccess = $x.publicNetworkAccess
              containerNames = @($x.containerNames)
              blobServiceName = $x.blobServiceName
              containerPublicAccess = $x.containerPublicAccess
            }
          }

          # SQL Database
          foreach ($x in $config.landingZones.sqlDatabases) {
            Save-Parameters "sql" @{
              location = $x.location
              serverName = $x.serverName
              databaseName = $x.databaseName
              administratorLogin = $x.administratorLogin
              sqlServerVersion = $x.sqlServerVersion
              databaseSkuName = $x.databaseSkuName
              databaseSkuTier = $x.databaseSkuTier
              databaseCapacity = $x.databaseCapacity
              databaseMaxSizeBytes = $x.databaseMaxSizeBytes
              publicNetworkAccess = $x.publicNetworkAccess
              minimumTlsVersion = $x.minimumTlsVersion
              tags = $x.tags
            }
          }

          # Azure OpenAI
          foreach ($x in $config.landingZones.openAiServices) {
            Save-Parameters "openai" @{
              accountName = $x.name
              location = $x.location
              skuName = $x.skuName
              customSubDomainName = $x.customSubDomainName
              publicNetworkAccess = $x.publicNetworkAccess
              tags = $x.tags
            }
          }

          # VM
          foreach ($x in $config.landingZones.vms) {
            Save-Parameters "vm" @{
              location = $x.location
              computerName = $x.computerName
              vmName = $x.name
              adminUsername = $x.adminUsername
              vmSize = $x.vmSize
              tags = $x.tags
              vnetName = $x.vnetName
              subnetName = $x.subnetName
              nicName = $x.nicName
              privateIpAllocationMethod = $x.privateIpAllocationMethod
              imagePublisher = $x.imagePublisher
              imageOffer = $x.imageOffer
              imageSku = $x.imageSku
              imageVersion = $x.imageVersion
              osDiskStorageAccountType = $x.osDiskStorageAccountType
              osDiskCreateOption = $x.osDiskCreateOption
              osDiskSizeGB = $x.osDiskSizeGB
              enableBootDiagnostics = $x.enableBootDiagnostics
            }
          }

          Write-Host "Input validation and parameter generation completed."

      - name: Upload generated parameters
        uses: actions/upload-artifact@v4
        with:
          name: pike-deployment-parameters
          path: .generated-parameters/
          if-no-files-found: error

  # JOB 4: AZURE WHAT-IF
  what-if:
    name: Azure Deployment What-If
    runs-on: [self-hosted, Windows, X64]
    needs: validate-input
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_resources }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download generated parameters
        uses: actions/download-artifact@v4
        with:
          name: pike-deployment-parameters
          path: .generated-parameters

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check subscription
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          az account show -o table

      - name: Resource Group What-If
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          az deployment sub what-if `
            --location "${{ needs.validate-input.outputs.location }}" `
            --template-file "modules/resourcegroup.bicep" `
            --parameters "@.generated-parameters/resourcegroup.json"
          if ($LASTEXITCODE -ne 0) {
            throw "Resource Group What-If failed."
          }

      - name: Infrastructure modules What-If
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $rg = "${{ needs.validate-input.outputs.rg_name }}"
          $modules = @(
            @{ Name = "NSG"; File = "modules/networking/nsg.bicep"; Params = "nsg" },
            @{ Name = "RouteTable"; File = "modules/networking/routetable.bicep"; Params = "routetable" },
            @{ Name = "VNet"; File = "modules/networking/vnet.bicep"; Params = "vnet" },
            @{ Name = "Subnet"; File = "modules/networking/subnet.bicep"; Params = "subnet" },
            @{ Name = "KeyVault"; File = "modules/security/keyvault.bicep"; Params = "keyvault" },
            @{ Name = "Storage"; File = "modules/storage/storageAccount.bicep"; Params = "storage" },
            @{ Name = "SQL"; File = "modules/database/sql.bicep"; Params = "sql" },
            @{ Name = "OpenAI"; File = "modules/ai/openai.bicep"; Params = "openai" },
            @{ Name = "VM"; File = "modules/compute/vm.bicep"; Params = "vm" }
          )
          foreach ($module in $modules) {
            $parameterFile = ".generated-parameters/$($module.Params).json"
            if (-not (Test-Path $parameterFile)) {
              Write-Host "Skipping $($module.Name): no parameters generated."
              continue
            }
            Write-Host "What-If: $($module.Name)"
            az deployment group what-if `
              --resource-group $rg `
              --template-file $module.File `
              --parameters "@$parameterFile"
            if ($LASTEXITCODE -ne 0) {
              throw "What-If failed for $($module.Name)."
            }
          }

  # JOB 5: RESOURCE GROUP
  deploy-rg:
    name: Deploy Resource Group
    runs-on: [self-hosted, Windows, X64]
    needs: [validate-input, what-if]
    if: ${{ always() && needs.validate-input.result == 'success' && needs.what-if.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pike-deployment-parameters
          path: .generated-parameters
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Resource Group
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          az deployment sub create `
            --name "pike-resourcegroup-${{ github.run_id }}" `
            --location "${{ needs.validate-input.outputs.location }}" `
            --template-file "modules/resourcegroup.bicep" `
            --parameters "@.generated-parameters/resourcegroup.json"
          if ($LASTEXITCODE -ne 0) {
            throw "Resource Group deployment failed."
          }

  # JOB 6: NETWORK SECURITY GROUP
  deploy-nsg:
    name: Deploy Network Security Group
    runs-on: [self-hosted, Windows, X64]
    needs: [validate-input, deploy-rg]
    if: ${{ needs.deploy-rg.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pike-deployment-parameters
          path: .generated-parameters
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy NSG
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          az deployment group create `
            --name "pike-nsg-${{ github.run_id }}" `
            --resource-group "${{ needs.validate-input.outputs.rg_name }}" `
            --template-file "modules/networking/nsg.bicep" `
            --parameters "@.generated-parameters/nsg.json"
          if ($LASTEXITCODE -ne 0) { throw "NSG deployment failed." }

  # JOB 7: ROUTE TABLE
  deploy-route-table:
    name: Deploy Route Table
    runs-on: [self-hosted, Windows, X64]
    needs: [validate-input, deploy-rg]
    if: ${{ needs.deploy-rg.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pike-deployment-parameters
          path: .generated-parameters
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Route Table
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          az deployment group create `
            --name "pike-routetable-${{ github.run_id }}" `
            --resource-group "${{ needs.validate-input.outputs.rg_name }}" `
            --template-file "modules/networking/routetable.bicep" `
            --parameters "@.generated-parameters/routetable.json"
          if ($LASTEXITCODE -ne 0) { throw "Route Table deployment failed." }

  # JOB 8: VIRTUAL NETWORK
  deploy-vnet:
    name: Deploy Virtual Network
    runs-on: [self-hosted, Windows, X64]
    needs: [validate-input, deploy-nsg, deploy-route-table]
    if: ${{ needs.deploy-nsg.result == 'success' && needs.deploy-route-table.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pike-deployment-parameters
          path: .generated-parameters
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy VNet
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $rg = "${{ needs.validate-input.outputs.rg_name }}"
          $config = Get-Content input.json -Raw | ConvertFrom-Json
          $vnetName = $config.landingZones.vnets[0].name
          $existing = az network vnet show --resource-group $rg --name $vnetName --query name -o tsv 2>$null
          if ($LASTEXITCODE -eq 0 -and $existing) {
            Write-Host "Existing VNet found. Skipping redeployment to preserve existing subnets."
          }
          else {
            az deployment group create `
              --name "pike-vnet-${{ github.run_id }}" `
              --resource-group $rg `
              --template-file "modules/networking/vnet.bicep" `
              --parameters "@.generated-parameters/vnet.json"
            if ($LASTEXITCODE -ne 0) { throw "VNet deployment failed." }
          }

  # JOB 9: SUBNET
  deploy-subnet:
    name: Deploy Subnet
    runs-on: [self-hosted, Windows, X64]
    needs: [validate-input, deploy-vnet, deploy-nsg, deploy-route-table]
    if: ${{ needs.deploy-vnet.result == 'success' && needs.deploy-nsg.result == 'success' && needs.deploy-route-table.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pike-deployment-parameters
          path: .generated-parameters
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Subnet
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          az deployment group create `
            --name "pike-subnet-${{ github.run_id }}" `
            --resource-group "${{ needs.validate-input.outputs.rg_name }}" `
            --template-file "modules/networking/subnet.bicep" `
            --parameters "@.generated-parameters/subnet.json"
          if ($LASTEXITCODE -ne 0) { throw "Subnet deployment failed." }

  # JOB 10: KEY VAULT
  deploy-keyvault:
    name: Deploy Key Vault
    runs-on: [self-hosted, Windows, X64]
    needs: [validate-input, deploy-rg]
    if: ${{ needs.deploy-rg.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pike-deployment-parameters
          path: .generated-parameters
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Key Vault
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          az deployment group create `
            --name "pike-keyvault-${{ github.run_id }}" `
            --resource-group "${{ needs.validate-input.outputs.rg_name }}" `
            --template-file "modules/security/keyvault.bicep" `
            --parameters "@.generated-parameters/keyvault.json"
          if ($LASTEXITCODE -ne 0) { throw "Key Vault deployment failed." }

  # JOB 11: STORAGE ACCOUNT
  deploy-storage:
    name: Deploy Storage Account
    runs-on: [self-hosted, Windows, X64]
    needs: [validate-input, deploy-rg]
    if: ${{ needs.deploy-rg.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pike-deployment-parameters
          path: .generated-parameters
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Storage Account
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          az deployment group create `
            --name "pike-storage-${{ github.run_id }}" `
            --resource-group "${{ needs.validate-input.outputs.rg_name }}" `
            --template-file "modules/storage/storageAccount.bicep" `
            --parameters "@.generated-parameters/storage.json"
          if ($LASTEXITCODE -ne 0) { throw "Storage deployment failed." }

  # JOB 12: SQL DATABASE
  deploy-sql:
    name: Deploy SQL Database
    runs-on: [self-hosted, Windows, X64]
    needs: [validate-input, deploy-rg]
    if: ${{ needs.deploy-rg.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pike-deployment-parameters
          path: .generated-parameters
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy SQL Database
        shell: pwsh
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          az deployment group create `
            --name "pike-sql-${{ github.run_id }}" `
            --resource-group "${{ needs.validate-input.outputs.rg_name }}" `
            --template-file "modules/database/sql.bicep" `
            --parameters "@.generated-parameters/sql.json" `
            administratorLoginPassword="$env:SQL_ADMIN_PASSWORD"
          if ($LASTEXITCODE -ne 0) { throw "SQL deployment failed." }

  # JOB 13: AZURE OPENAI
  deploy-openai:
    name: Deploy Azure OpenAI
    runs-on: [self-hosted, Windows, X64]
    needs: [validate-input, deploy-rg]
    if: ${{ needs.deploy-rg.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pike-deployment-parameters
          path: .generated-parameters
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Azure OpenAI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          az deployment group create `
            --name "pike-openai-${{ github.run_id }}" `
            --resource-group "${{ needs.validate-input.outputs.rg_name }}" `
            --template-file "modules/ai/openai.bicep" `
            --parameters "@.generated-parameters/openai.json"
          if ($LASTEXITCODE -ne 0) { throw "OpenAI deployment failed." }

  # JOB 14: VIRTUAL MACHINE
  deploy-vm:
    name: Deploy Virtual Machine
    runs-on: [self-hosted, Windows, X64]
    needs: [validate-input, deploy-subnet]
    if: ${{ needs.deploy-subnet.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pike-deployment-parameters
          path: .generated-parameters
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Virtual Machine
        shell: pwsh
        env:
          VM_ADMIN_PASSWORD: ${{ secrets.VM_ADMIN_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          az deployment group create `
            --name "pike-vm-${{ github.run_id }}" `
            --resource-group "${{ needs.validate-input.outputs.rg_name }}" `
            --template-file "modules/compute/vm.bicep" `
            --parameters "@.generated-parameters/vm.json" `
            vmAdminPassword="$env:VM_ADMIN_PASSWORD"
          if ($LASTEXITCODE -ne 0) { throw "VM deployment failed." }

  # JOB 15: FINAL VERIFICATION
  verify:
    name: Deployment Verification
    runs-on: [self-hosted, Windows, X64]
    needs:
      - deploy-rg
      - deploy-nsg
      - deploy-route-table
      - deploy-vnet
      - deploy-subnet
      - deploy-keyvault
      - deploy-storage
      - deploy-sql
      - deploy-openai
      - deploy-vm
    if: always()
    steps:
      - name: Report deployment job results
        shell: pwsh
        env:
          RG_RESULT: ${{ needs.deploy-rg.result }}
          NSG_RESULT: ${{ needs.deploy-nsg.result }}
          ROUTE_RESULT: ${{ needs.deploy-route-table.result }}
          VNET_RESULT: ${{ needs.deploy-vnet.result }}
          SUBNET_RESULT: ${{ needs.deploy-subnet.result }}
          KEYVAULT_RESULT: ${{ needs.deploy-keyvault.result }}
          STORAGE_RESULT: ${{ needs.deploy-storage.result }}
          SQL_RESULT: ${{ needs.deploy-sql.result }}
          OPENAI_RESULT: ${{ needs.deploy-openai.result }}
          VM_RESULT: ${{ needs.deploy-vm.result }}
        run: |
          $ErrorActionPreference = "Continue"
          $results = [ordered]@{
            "Resource Group" = $env:RG_RESULT
            "NSG" = $env:NSG_RESULT
            "Route Table" = $env:ROUTE_RESULT
            "VNet" = $env:VNET_RESULT
            "Subnet" = $env:SUBNET_RESULT
            "Key Vault" = $env:KEYVAULT_RESULT
            "Storage Account" = $env:STORAGE_RESULT
            "SQL Database" = $env:SQL_RESULT
            "OpenAI" = $env:OPENAI_RESULT
            "Virtual Machine" = $env:VM_RESULT
          }
          Write-Host "PIKE DEPLOYMENT SUMMARY"
          foreach ($item in $results.GetEnumerator()) {
            Write-Host "$($item.Key): $($item.Value)"
          }
          $failed = @($results.GetEnumerator() | Where-Object { $_.Value -ne "success" })
          if ($failed.Count -gt 0) {
            throw "One or more infrastructure deployment jobs failed or were skipped."
          }
