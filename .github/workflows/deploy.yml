name: Deploy Azure infrastructure from input.json

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test1
        uses: actions/checkout@v4
        with:
          ref: test1

      - name: Validate input.json
        shell: bash
        run: |
          set -euo pipefail
          jq empty input.json
          jq -e '.environment and .location and (.landingZones | type == "object")' input.json >/dev/null
          for key in resourceGroups nsgs routeTables vnets subnets storageAccounts keyVaults vms sqlDatabases openAiServices; do
            jq -e --arg key "$key" '.landingZones[$key] | type == "array"' input.json >/dev/null
          done

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Bicep and compile canonical modules
        shell: bash
        run: |
          set -euo pipefail
          az bicep install
          for file in modules/resourcegroup.bicep modules/networking/nsg.bicep modules/networking/routetable.bicep modules/networking/vnet.bicep modules/networking/subnet.bicep modules/storage/storageAccount.bicep modules/security/keyvault.bicep modules/compute/vm.bicep modules/database/sql.bicep modules/ai/openai.bicep; do
            echo "Compiling $file"
            az bicep build --file "$file" --stdout >/dev/null
          done

      - name: Deploy resource groups
        run: |
          set -euo pipefail
          jq -c '.landingZones.resourceGroups[]' input.json | while read -r x; do
            loc=$(jq -r '.location' <<< "$x")
            jq -n --argjson x "$x" '{parameters:{rgname:{value:$x.rgName},location:{value:$x.location},tags:{value:$x.tags}}}' > params.json
            az deployment sub create --name "rg-$GITHUB_RUN_NUMBER" --location "$loc" --template-file modules/resourcegroup.bicep --parameters @params.json
          done

      - name: Deploy NSGs
        run: |
          set -euo pipefail
          jq -c '.landingZones.nsgs[]' input.json | while read -r x; do
            rg=$(jq -r '.resourceGroupName' <<< "$x")
            jq -n --argjson x "$x" '{parameters:{location:{value:$x.location},nsgName:{value:$x.name},securityRules:{value:$x.securityRules},tags:{value:$x.tags}}}' > params.json
            az deployment group create -g "$rg" --name "nsg-$GITHUB_RUN_NUMBER" --template-file modules/networking/nsg.bicep --parameters @params.json
          done

      - name: Deploy route tables
        run: |
          set -euo pipefail
          jq -c '.landingZones.routeTables[]' input.json | while read -r x; do
            rg=$(jq -r '.resourceGroupName' <<< "$x")
            jq -n --argjson x "$x" '{parameters:{routeTableName:{value:$x.name},location:{value:$x.location},disableBgpRoutePropagation:{value:$x.disableBgpRoutePropagation},routes:{value:$x.routes},tags:{value:$x.tags}}}' > params.json
            az deployment group create -g "$rg" --name "rt-$GITHUB_RUN_NUMBER" --template-file modules/networking/routetable.bicep --parameters @params.json
          done

      - name: Deploy virtual networks
        run: |
          set -euo pipefail
          jq -c '.landingZones.vnets[]' input.json | while read -r x; do
            rg=$(jq -r '.resourceGroupName' <<< "$x")
            jq -n --argjson x "$x" '{parameters:{location:{value:$x.location},vnetName:{value:$x.name},addressPrefixes:{value:$x.addressPrefixes},dnsServers:{value:$x.dnsServers},tags:{value:$x.tags},subnets:{value:[]}}}' > params.json
            az deployment group create -g "$rg" --name "vnet-$GITHUB_RUN_NUMBER" --template-file modules/networking/vnet.bicep --parameters @params.json
          done

      - name: Deploy subnets and associate NSGs and route tables
        run: |
          set -euo pipefail
          jq -c '.landingZones.subnets[]' input.json | while read -r x; do
            rg=$(jq -r '.resourceGroupName' <<< "$x")
            jq -n --argjson x "$x" '{parameters:{vnetName:{value:$x.vnetName},subnetName:{value:$x.name},addressPrefix:{value:$x.addressPrefix},networkSecurityGroupName:{value:($x.networkSecurityGroupName // "")},routeTableName:{value:($x.routeTableName // "")},serviceEndpoints:{value:$x.serviceEndpoints},privateEndpointNetworkPolicies:{value:$x.privateEndpointNetworkPolicies},privateLinkServiceNetworkPolicies:{value:$x.privateLinkServiceNetworkPolicies}}}' > params.json
            az deployment group create -g "$rg" --name "subnet-$GITHUB_RUN_NUMBER" --template-file modules/networking/subnet.bicep --parameters @params.json
          done

      - name: Deploy storage accounts
        run: |
          set -euo pipefail
          jq -c '.landingZones.storageAccounts[]' input.json | while read -r x; do
            rg=$(jq -r '.resourceGroupName' <<< "$x")
            jq -n --argjson x "$x" '{parameters:{storageAccountName:{value:$x.name},location:{value:$x.location},tags:{value:$x.tags},skuName:{value:$x.skuName},kind:{value:$x.kind},accessTier:{value:$x.accessTier},minimumTlsVersion:{value:$x.minimumTlsVersion},supportsHttpsTrafficOnly:{value:$x.supportsHttpsTrafficOnly},allowBlobPublicAccess:{value:$x.allowBlobPublicAccess},allowSharedKeyAccess:{value:$x.allowSharedKeyAccess},publicNetworkAccess:{value:$x.publicNetworkAccess},containerNames:{value:$x.containerNames},blobServiceName:{value:$x.blobServiceName},containerPublicAccess:{value:$x.containerPublicAccess}}}' > params.json
            az deployment group create -g "$rg" --name "storage-$GITHUB_RUN_NUMBER" --template-file modules/storage/storageAccount.bicep --parameters @params.json
          done

      - name: Deploy Key Vaults
        run: |
          set -euo pipefail
          tenant=$(az account show --query tenantId -o tsv)
          jq -c '.landingZones.keyVaults[]' input.json | while read -r x; do
            rg=$(jq -r '.resourceGroupName' <<< "$x")
            jq -n --argjson x "$x" --arg tenant "$tenant" '{parameters:{keyVaultName:{value:$x.name},location:{value:$x.location},tenantId:{value:$tenant},skuName:{value:$x.skuName},skuFamily:{value:$x.skuFamily},enableRbacAuthorization:{value:$x.enableRbacAuthorization},enablePurgeProtection:{value:$x.enablePurgeProtection},softDeleteRetentionInDays:{value:$x.softDeleteRetentionInDays},publicNetworkAccess:{value:$x.publicNetworkAccess},tags:{value:$x.tags}}}' > params.json
            az deployment group create -g "$rg" --name "kv-$GITHUB_RUN_NUMBER" --template-file modules/security/keyvault.bicep --parameters @params.json
          done

      - name: Deploy Windows VMs
        env:
          VM_ADMIN_PASSWORD: ${{ secrets.VM_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$VM_ADMIN_PASSWORD"
          jq -c '.landingZones.vms[]' input.json | while read -r x; do
            rg=$(jq -r '.resourceGroupName' <<< "$x")
            jq -n --argjson x "$x" --arg password "$VM_ADMIN_PASSWORD" '{parameters:{location:{value:$x.location},computerName:{value:$x.computerName},vmName:{value:$x.name},adminUsername:{value:$x.adminUsername},vmAdminPassword:{value:$password},vmSize:{value:$x.vmSize},tags:{value:$x.tags},vnetName:{value:$x.vnetName},subnetName:{value:$x.subnetName},nicName:{value:$x.nicName},privateIpAllocationMethod:{value:$x.privateIpAllocationMethod},imagePublisher:{value:$x.imagePublisher},imageOffer:{value:$x.imageOffer},imageSku:{value:$x.imageSku},imageVersion:{value:$x.imageVersion},osDiskStorageAccountType:{value:$x.osDiskStorageAccountType},osDiskCreateOption:{value:$x.osDiskCreateOption},osDiskSizeGB:{value:$x.osDiskSizeGB},enableBootDiagnostics:{value:$x.enableBootDiagnostics}}}' > params.json
            az deployment group create -g "$rg" --name "vm-$GITHUB_RUN_NUMBER" --template-file modules/compute/vm.bicep --parameters @params.json
          done

      - name: Deploy SQL servers and databases
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SQL_ADMIN_PASSWORD"
          jq -c '.landingZones.sqlDatabases[]' input.json | while read -r x; do
            rg=$(jq -r '.resourceGroupName' <<< "$x")
            jq -n --argjson x "$x" --arg password "$SQL_ADMIN_PASSWORD" '{parameters:{location:{value:$x.location},serverName:{value:$x.serverName},databaseName:{value:$x.databaseName},administratorLogin:{value:$x.administratorLogin},administratorLoginPassword:{value:$password},sqlServerVersion:{value:$x.sqlServerVersion},databaseSkuName:{value:$x.databaseSkuName},databaseSkuTier:{value:$x.databaseSkuTier},databaseCapacity:{value:$x.databaseCapacity},databaseMaxSizeBytes:{value:$x.databaseMaxSizeBytes},publicNetworkAccess:{value:$x.publicNetworkAccess},minimumTlsVersion:{value:$x.minimumTlsVersion},tags:{value:$x.tags}}}' > params.json
            az deployment group create -g "$rg" --name "sql-$GITHUB_RUN_NUMBER" --template-file modules/database/sql.bicep --parameters @params.json
          done

      - name: Deploy Azure OpenAI services
        run: |
          set -euo pipefail
          jq -c '.landingZones.openAiServices[]' input.json | while read -r x; do
            rg=$(jq -r '.resourceGroupName' <<< "$x")
            jq -n --argjson x "$x" '{parameters:{accountName:{value:$x.name},location:{value:$x.location},skuName:{value:$x.skuName},customSubDomainName:{value:$x.customSubDomainName},publicNetworkAccess:{value:$x.publicNetworkAccess},tags:{value:$x.tags}}}' > params.json
            az deployment group create -g "$rg" --name "openai-$GITHUB_RUN_NUMBER" --template-file modules/ai/openai.bicep --parameters @params.json
          done
