name: PIKE Modular Azure Infrastructure Deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  prechecks:
    name: Bicep lint and input validation
    runs-on: [self-hosted, X64, Windows]
    steps:
      - uses: actions/checkout@v4
      - name: Check Azure CLI, Bicep and required secrets
        shell: pwsh
        env:
          VM_ADMIN_PASSWORD: ${{ secrets.VM_ADMIN_PASSWORD }}
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          $ErrorActionPreference = "Stop"
          $az = "C:\Program Files\Microsoft SDKs\Azure\CLI2\wbin\az.cmd"
          if (-not (Test-Path $az)) { throw "Azure CLI not found at $az" }
          & $az version
          if ($LASTEXITCODE -ne 0) { throw "Azure CLI check failed." }
          & $az bicep install
          if ($LASTEXITCODE -ne 0) { throw "Bicep installation failed." }
          # Upgrade Bicep
          & $az bicep upgrade
          if ($LASTEXITCODE -ne 0) { throw "Bicep upgrade failed." }
          & $az bicep version
          if ([string]::IsNullOrWhiteSpace($env:VM_ADMIN_PASSWORD)) { throw "VM_ADMIN_PASSWORD secret is missing." }
          if ([string]::IsNullOrWhiteSpace($env:SQL_ADMIN_PASSWORD)) { throw "SQL_ADMIN_PASSWORD secret is missing." }
          if ([string]::IsNullOrWhiteSpace($env:AZURE_SUBSCRIPTION_ID)) { throw "AZURE_SUBSCRIPTION_ID secret is missing or unavailable." }
          if ($env:AZURE_SUBSCRIPTION_ID -notmatch '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$') { throw "AZURE_SUBSCRIPTION_ID is not a valid GUID." }
          Write-Host "Subscription ID secret is available and has valid GUID format; value will not be printed."
          # if (-not (Test-Path "bicepconfig.json")) { throw "bicepconfig.json not found." }
          $files = @(Get-ChildItem modules -Recurse -Filter "*.bicep")
          if ($files.Count -eq 0) { throw "No Bicep modules found." }
          foreach ($file in $files) {
            Write-Host "Building $($file.FullName)"
            & $az bicep build --file $file.FullName --stdout | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Bicep build failed: $($file.Name)" }
          }
    
      - name: Validate input.json structure
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cfg = Get-Content "input.json" -Raw | ConvertFrom-Json
          $environment = ([string]$cfg.environment).Trim().ToLowerInvariant()
          Write-Host "Environment found in input.json: '$environment'"
          if ([string]::IsNullOrWhiteSpace($environment)) {
            throw "input.json must contain a root-level 'environment' property with value 'dev'."
          }
          if ($environment -ne "dev") {
            throw "Expected environment 'dev' in input.json, but found '$environment'."
          }
          if (-not $cfg.landingZones.resourceGroups -or @($cfg.landingZones.resourceGroups).Count -eq 0) {
            throw "No resource groups found in input.json."
          }
          foreach ($name in @("vnets","subnets","nsgs","routeTables","vms","keyVaults","storageAccounts","sqlDatabases","openAiServices")) {
            if ($null -eq $cfg.landingZones.$name) { throw "landingZones.$name is missing from input.json." }
          }

  azure-login-check:
    name: Azure OIDC login and subscription check
    runs-on: [self-hosted, X64, Windows]
    needs: prechecks
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - name: Check subscription secret is available
        shell: pwsh
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:AZURE_SUBSCRIPTION_ID)) {
            throw "AZURE_SUBSCRIPTION_ID is empty or unavailable to this workflow."
          }
          if ($env:AZURE_SUBSCRIPTION_ID -notmatch '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$') {
            throw "AZURE_SUBSCRIPTION_ID is not a valid GUID."
          }
          Write-Host "Subscription ID secret is available and has valid GUID format; value will not be printed."
      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verify selected subscription
        shell: pwsh
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          $ErrorActionPreference = "Stop"
          $az = "C:\Program Files\Microsoft SDKs\Azure\CLI2\wbin\az.cmd"
          & $az account set --subscription $env:AZURE_SUBSCRIPTION_ID
          if ($LASTEXITCODE -ne 0) { throw "Could not select subscription." }
          & $az account show --query "{name:name,id:id,tenantId:tenantId}" -o json
          if ($LASTEXITCODE -ne 0) { throw "Azure subscription verification failed." }

  deploy-rg:
    name: Deploy Resource Groups
    runs-on: [self-hosted, X64, Windows]
    needs: [prechecks, azure-login-check]
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: What-If and deploy Resource Groups
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $az = "C:\Program Files\Microsoft SDKs\Azure\CLI2\wbin\az.cmd"
          $cfg = Get-Content "input.json" -Raw | ConvertFrom-Json
          foreach ($x in @($cfg.landingZones.resourceGroups)) {
            $p = @{ '$schema'='https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#'; contentVersion='1.0.0.0'; parameters=@{ rgname=@{value=$x.rgName}; location=@{value=$x.location}; tags=@{value=$x.tags} } }
            $p | ConvertTo-Json -Depth 100 | Set-Content "$env:RUNNER_TEMP\rg-params.json"
            & $az deployment sub what-if --location $x.location --template-file "modules/RG/resourcegroup.bicep" --parameters "@$env:RUNNER_TEMP\rg-params.json"
            if ($LASTEXITCODE -ne 0) { throw "Resource group What-If failed: $($x.rgName)" }
            & $az deployment sub create --name "pike-rg-${{ github.run_id }}" --location $x.location --template-file "modules/RG/resourcegroup.bicep" --parameters "@$env:RUNNER_TEMP\rg-params.json"
            if ($LASTEXITCODE -ne 0) { throw "Resource group deployment failed: $($x.rgName)" }
          }

  deploy-nsg:
    name: Deploy Network Security Groups
    runs-on: [self-hosted, X64, Windows]
    needs: [prechecks, deploy-rg]
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: What-If and deploy NSGs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"; $az = "C:\Program Files\Microsoft SDKs\Azure\CLI2\wbin\az.cmd"
          $cfg = Get-Content "input.json" -Raw | ConvertFrom-Json
          foreach ($x in @($cfg.landingZones.nsgs)) {
            $v = @{location=$x.location;nsgName=$x.name;securityRules=@($x.securityRules);tags=$x.tags}
            $p = @{ '$schema'='https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#';contentVersion='1.0.0.0';parameters=@{} }
            foreach($k in $v.Keys){$p.parameters[$k]=@{value=$v[$k]}}
            $f="$env:RUNNER_TEMP\nsg.json"; $p|ConvertTo-Json -Depth 100|Set-Content $f
            & $az deployment group what-if -g $x.resourceGroupName -f "modules/networking/nsg.bicep" --parameters "@$f"; if($LASTEXITCODE -ne 0){throw "NSG What-If failed"}
            & $az deployment group create -g $x.resourceGroupName -n "pike-nsg-${{ github.run_id }}" -f "modules/networking/nsg.bicep" --parameters "@$f"; if($LASTEXITCODE -ne 0){throw "NSG deployment failed"}
          }

  deploy-route-table:
    name: Deploy Route Tables
    runs-on: [self-hosted, X64, Windows]
    needs: deploy-nsg
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: What-If and deploy Route Tables
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"; $az="C:\Program Files\Microsoft SDKs\Azure\CLI2\wbin\az.cmd"; $cfg=Get-Content input.json -Raw|ConvertFrom-Json
          foreach($x in @($cfg.landingZones.routeTables)){
            $v=@{routeTableName=$x.name;location=$x.location;disableBgpRoutePropagation=$x.disableBgpRoutePropagation;routes=@($x.routes);tags=$x.tags}; $p=@{'$schema'='https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#';contentVersion='1.0.0.0';parameters=@{}}
            foreach($k in $v.Keys){$p.parameters[$k]=@{value=$v[$k]}}; $f="$env:RUNNER_TEMP\rt.json"; $p|ConvertTo-Json -Depth 100|Set-Content $f
            & $az deployment group what-if -g $x.resourceGroupName -f "modules/networking/routetable.bicep" --parameters "@$f"; if($LASTEXITCODE -ne 0){throw "Route table What-If failed"}
            & $az deployment group create -g $x.resourceGroupName -n "pike-rt-${{ github.run_id }}" -f "modules/networking/routetable.bicep" --parameters "@$f"; if($LASTEXITCODE -ne 0){throw "Route table deployment failed"}
          }

  deploy-vnet:
    name: Deploy Virtual Networks
    runs-on: [self-hosted, X64, Windows]
    needs: deploy-route-table
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: What-If and deploy VNets safely
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"; $az="C:\Program Files\Microsoft SDKs\Azure\CLI2\wbin\az.cmd"; $cfg=Get-Content input.json -Raw|ConvertFrom-Json
          foreach($x in @($cfg.landingZones.vnets)){
            & $az network vnet show -g $x.resourceGroupName -n $x.name --query name -o tsv 2>$null
            if($LASTEXITCODE -eq 0){Write-Host "VNet $($x.name) already exists; skipping VNet template to avoid replacing existing subnet configuration."; continue}
            $v=@{location=$x.location;vnetName=$x.name;addressPrefixes=@($x.addressPrefixes);tags=$x.tags;dnsServers=@($x.dnsServers);subnets=@()}; $p=@{'$schema'='https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#';contentVersion='1.0.0.0';parameters=@{}}
            foreach($k in $v.Keys){$p.parameters[$k]=@{value=$v[$k]}}; $f="$env:RUNNER_TEMP\vnet.json"; $p|ConvertTo-Json -Depth 100|Set-Content $f
            & $az deployment group what-if -g $x.resourceGroupName -f "modules/networking/vnet.bicep" --parameters "@$f"; if($LASTEXITCODE -ne 0){throw "VNet What-If failed"}
            & $az deployment group create -g $x.resourceGroupName -n "pike-vnet-${{ github.run_id }}" -f "modules/networking/vnet.bicep" --parameters "@$f"; if($LASTEXITCODE -ne 0){throw "VNet deployment failed"}
          }

  deploy-subnet:
    name: Deploy Subnets
    runs-on: [self-hosted, X64, Windows]
    needs: deploy-vnet
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: What-If and deploy Subnets
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"; $az="C:\Program Files\Microsoft SDKs\Azure\CLI2\wbin\az.cmd"; $cfg=Get-Content input.json -Raw|ConvertFrom-Json
          foreach($x in @($cfg.landingZones.subnets)){
            $v=@{vnetName=$x.vnetName;subnetName=$x.name;addressPrefix=$x.addressPrefix;networkSecurityGroupName=$x.networkSecurityGroupName;routeTableName=$x.routeTableName;serviceEndpoints=@($x.serviceEndpoints);privateEndpointNetworkPolicies=$x.privateEndpointNetworkPolicies;privateLinkServiceNetworkPolicies=$x.privateLinkServiceNetworkPolicies}; $p=@{'$schema'='https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#';contentVersion='1.0.0.0';parameters=@{}}
            foreach($k in $v.Keys){$p.parameters[$k]=@{value=$v[$k]}}; $f="$env:RUNNER_TEMP\subnet.json"; $p|ConvertTo-Json -Depth 100|Set-Content $f
            & $az deployment group what-if -g $x.resourceGroupName -f "modules/networking/subnet.bicep" --parameters "@$f"; if($LASTEXITCODE -ne 0){throw "Subnet What-If failed"}
            & $az deployment group create -g $x.resourceGroupName -n "pike-subnet-${{ github.run_id }}" -f "modules/networking/subnet.bicep" --parameters "@$f"; if($LASTEXITCODE -ne 0){throw "Subnet deployment failed"}
          }

  deploy-keyvault:
    name: Deploy Key Vaults
    runs-on: [self-hosted, X64, Windows]
    needs: deploy-subnet
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: What-If and deploy Key Vaults
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"; $az="C:\Program Files\Microsoft SDKs\Azure\CLI2\wbin\az.cmd"; $cfg=Get-Content input.json -Raw|ConvertFrom-Json; $tenant=& $az account show --query tenantId -o tsv
          foreach($x in @($cfg.landingZones.keyVaults)){
            $v=@{keyVaultName=$x.name;location=$x.location;tenantId=$tenant;skuName=$x.skuName;skuFamily=$x.skuFamily;enableRbacAuthorization=$x.enableRbacAuthorization;enablePurgeProtection=$x.enablePurgeProtection;softDeleteRetentionInDays=$x.softDeleteRetentionInDays;publicNetworkAccess=$x.publicNetworkAccess;tags=$x.tags}; $p=@{'$schema'='https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#';contentVersion='1.0.0.0';parameters=@{}}
            foreach($k in $v.Keys){$p.parameters[$k]=@{value=$v[$k]}}; $f="$env:RUNNER_TEMP\kv.json"; $p|ConvertTo-Json -Depth 100|Set-Content $f
            & $az deployment group what-if -g $x.resourceGroupName -f "modules/security/keyvault.bicep" --parameters "@$f"; if($LASTEXITCODE -ne 0){throw "Key Vault What-If failed"}
            & $az deployment group create -g $x.resourceGroupName -n "pike-kv-${{ github.run_id }}" -f "modules/security/keyvault.bicep" --parameters "@$f"; if($LASTEXITCODE -ne 0){throw "Key Vault deployment failed"}
          }

  deploy-storage:
    name: Deploy Storage Accounts
    runs-on: [self-hosted, X64, Windows]
    needs: deploy-keyvault
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: What-If and deploy Storage Accounts
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"; $az="C:\Program Files\Microsoft SDKs\Azure\CLI2\wbin\az.cmd"; $cfg=Get-Content input.json -Raw|ConvertFrom-Json
          Write-Host "Configured Storage Account names: $((@($cfg.landingZones.storageAccounts) | ForEach-Object { $_.name }) -join ', ')"
          foreach($x in @($cfg.landingZones.storageAccounts)){
            $v=@{storageAccountName=$x.name;location=$x.location;tags=$x.tags;skuName=$x.skuName;kind=$x.kind;accessTier=$x.accessTier;minimumTlsVersion=$x.minimumTlsVersion;supportsHttpsTrafficOnly=$x.supportsHttpsTrafficOnly;allowBlobPublicAccess=$x.allowBlobPublicAccess;allowSharedKeyAccess=$x.allowSharedKeyAccess;publicNetworkAccess=$x.publicNetworkAccess;containerNames=@($x.containerNames);blobServiceName=$x.blobServiceName;containerPublicAccess=$x.containerPublicAccess}; $p=@{'$schema'='https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#';contentVersion='1.0.0.0';parameters=@{}}
            foreach($k in $v.Keys){$p.parameters[$k]=@{value=$v[$k]}}; $f="$env:RUNNER_TEMP\storage.json"; $p|ConvertTo-Json -Depth 100|Set-Content $f
            & $az deployment group what-if -g $x.resourceGroupName -f "modules/storage/storageAccount.bicep" --parameters "@$f"; if($LASTEXITCODE -ne 0){throw "Storage What-If failed"}
            & $az deployment group create -g $x.resourceGroupName -n "pike-storage-${{ github.run_id }}" -f "modules/storage/storageAccount.bicep" --parameters "@$f"; if($LASTEXITCODE -ne 0){throw "Storage deployment failed"}
          }

  deploy-sql:
    name: Deploy SQL Databases
    runs-on: [self-hosted, X64, Windows]
    needs: deploy-storage
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: What-If and deploy SQL Databases
        shell: pwsh
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
        run: |
          $ErrorActionPreference="Stop"; $az="C:\Program Files\Microsoft SDKs\Azure\CLI2\wbin\az.cmd"; $cfg=Get-Content input.json -Raw|ConvertFrom-Json
          foreach($x in @($cfg.landingZones.sqlDatabases)){
            $v=@{location=$x.location;serverName=$x.serverName;databaseName=$x.databaseName;administratorLogin=$x.administratorLogin;sqlServerVersion=$x.sqlServerVersion;databaseSkuName=$x.databaseSkuName;databaseSkuTier=$x.databaseSkuTier;databaseCapacity=$x.databaseCapacity;databaseMaxSizeBytes=$x.databaseMaxSizeBytes;publicNetworkAccess=$x.publicNetworkAccess;minimumTlsVersion=$x.minimumTlsVersion;tags=$x.tags}; $p=@{'$schema'='https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#';contentVersion='1.0.0.0';parameters=@{}}
            foreach($k in $v.Keys){$p.parameters[$k]=@{value=$v[$k]}}; $f="$env:RUNNER_TEMP\sql.json"; $p|ConvertTo-Json -Depth 100|Set-Content $f
            & $az deployment group what-if -g $x.resourceGroupName -f "modules/database/sql.bicep" --parameters "@$f" "administratorLoginPassword=$env:SQL_ADMIN_PASSWORD"; if($LASTEXITCODE -ne 0){throw "SQL What-If failed"}
            & $az deployment group create -g $x.resourceGroupName -n "pike-sql-${{ github.run_id }}" -f "modules/database/sql.bicep" --parameters "@$f" "administratorLoginPassword=$env:SQL_ADMIN_PASSWORD"; if($LASTEXITCODE -ne 0){throw "SQL deployment failed"}
          }

  deploy-openai:
    name: Deploy Azure OpenAI Services
    runs-on: [self-hosted, X64, Windows]
    needs: deploy-sql
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: What-If and deploy Azure OpenAI
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"; $az="C:\Program Files\Microsoft SDKs\Azure\CLI2\wbin\az.cmd"; $cfg=Get-Content input.json -Raw|ConvertFrom-Json
          Write-Host "Configured Azure OpenAI names: $((@($cfg.landingZones.openAiServices) | ForEach-Object { $_.name }) -join ', ')"
          foreach($x in @($cfg.landingZones.openAiServices)){
            $v=@{accountName=$x.name;location=$x.location;skuName=$x.skuName;customSubDomainName=$x.customSubDomainName;publicNetworkAccess=$x.publicNetworkAccess;tags=$x.tags}; $p=@{'$schema'='https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#';contentVersion='1.0.0.0';parameters=@{}}
            foreach($k in $v.Keys){$p.parameters[$k]=@{value=$v[$k]}}; $f="$env:RUNNER_TEMP\openai.json"; $p|ConvertTo-Json -Depth 100|Set-Content $f
            & $az deployment group what-if -g $x.resourceGroupName -f "modules/ai/openai.bicep" --parameters "@$f"; if($LASTEXITCODE -ne 0){throw "OpenAI What-If failed"}
            & $az deployment group create -g $x.resourceGroupName -n "pike-openai-${{ github.run_id }}" -f "modules/ai/openai.bicep" --parameters "@$f"; if($LASTEXITCODE -ne 0){throw "OpenAI deployment failed"}
          }

  deploy-vm:
    name: Deploy Virtual Machines
    runs-on: [self-hosted, X64, Windows]
    needs: deploy-openai
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: What-If and deploy Virtual Machines
        shell: pwsh
        env:
          VM_ADMIN_PASSWORD: ${{ secrets.VM_ADMIN_PASSWORD }}
        run: |
          $ErrorActionPreference="Stop"; $az="C:\Program Files\Microsoft SDKs\Azure\CLI2\wbin\az.cmd"; $cfg=Get-Content input.json -Raw|ConvertFrom-Json
          foreach($x in @($cfg.landingZones.vms)){
            $v=@{location=$x.location;computerName=$x.computerName;vmName=$x.name;adminUsername=$x.adminUsername;vmSize=$x.vmSize;tags=$x.tags;vnetName=$x.vnetName;subnetName=$x.subnetName;nicName=$x.nicName;privateIpAllocationMethod=$x.privateIpAllocationMethod;imagePublisher=$x.imagePublisher;imageOffer=$x.imageOffer;imageSku=$x.imageSku;imageVersion=$x.imageVersion;osDiskStorageAccountType=$x.osDiskStorageAccountType;osDiskCreateOption=$x.osDiskCreateOption;osDiskSizeGB=$x.osDiskSizeGB;enableBootDiagnostics=$x.enableBootDiagnostics}; $p=@{'$schema'='https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#';contentVersion='1.0.0.0';parameters=@{}}
            foreach($k in $v.Keys){$p.parameters[$k]=@{value=$v[$k]}}; $f="$env:RUNNER_TEMP\vm.json"; $p|ConvertTo-Json -Depth 100|Set-Content $f
            & $az deployment group what-if -g $x.resourceGroupName -f "modules/compute/vm.bicep" --parameters "@$f" "vmAdminPassword=$env:VM_ADMIN_PASSWORD"; if($LASTEXITCODE -ne 0){throw "VM What-If failed"}
            & $az deployment group create -g $x.resourceGroupName -n "pike-vm-${{ github.run_id }}" -f "modules/compute/vm.bicep" --parameters "@$f" "vmAdminPassword=$env:VM_ADMIN_PASSWORD"; if($LASTEXITCODE -ne 0){throw "VM deployment failed"}
          }

