name: Deploy Azure infrastructure

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout test1
        uses: actions/checkout@v4
        with:
          ref: test1

      - name: Validate input JSON
        shell: bash
        run: |
          set -euo pipefail
          jq empty input.json
          jq -e '.environment and .location and .landingZones' input.json >/dev/null

          for key in resourceGroups nsgs routeTables vnets subnets storageAccounts keyVaults vms sqlDatabases; do
            jq -e --arg key "$key" '.landingZones[$key] | type == "array"' input.json >/dev/null
          done

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Generate Bicep parameter file
        shell: bash
        run: |
          set -euo pipefail
          jq '{
            "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
            "contentVersion": "1.0.0.0",
            "parameters": {
              "environment": { "value": .environment },
              "location": { "value": .location },
              "landingZones": { "value": .landingZones }
            }
          }' input.json > generated.parameters.json

      - name: Validate subscription deployment
        shell: bash
        env:
          VM_ADMIN_PASSWORD: ${{ secrets.VM_ADMIN_PASSWORD }}
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$VM_ADMIN_PASSWORD"
          test -n "$SQL_ADMIN_PASSWORD"

          LOCATION=$(jq -r '.location' input.json)

          az deployment sub validate \
            --location "$LOCATION" \
            --template-file modules/main.bicep \
            --parameters @generated.parameters.json \
            vmAdminPassword="$VM_ADMIN_PASSWORD" \
            sqlAdminPassword="$SQL_ADMIN_PASSWORD"

      - name: Deploy subscription infrastructure
        shell: bash
        env:
          VM_ADMIN_PASSWORD: ${{ secrets.VM_ADMIN_PASSWORD }}
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          LOCATION=$(jq -r '.location' input.json)

          az deployment sub create \
            --name "pike-${GITHUB_RUN_NUMBER}" \
            --location "$LOCATION" \
            --template-file modules/main.bicep \
            --parameters @generated.parameters.json \
            vmAdminPassword="$VM_ADMIN_PASSWORD" \
            sqlAdminPassword="$SQL_ADMIN_PASSWORD"
