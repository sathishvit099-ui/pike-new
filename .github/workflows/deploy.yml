name: Deploy Azure infrastructure

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout test1
        uses: actions/checkout@v4
        with:
          ref: test1

      - name: Install Azure CLI
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            az version

      - name: Validate input JSON
        shell: bash
        run: |
          set -euo pipefail
          jq empty input.json
          for key in resourceGroupName location tags vnet subnet vm; do
            jq -e --arg key "$key" '.[$key] != null' input.json >/dev/null
          done
          jq -e '.vnet.name and .vnet.addressPrefix and .subnet.name and .subnet.addressPrefix and .vm.name and .vm.size and .vm.adminUsername and .vm.sshPublicKey and .vm.osDiskSizeGB' input.json >/dev/null

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create resource group and deploy
        shell: bash
        run: |
          set -euo pipefail

          RG=$(jq -r '.resourceGroupName' input.json)
          LOCATION=$(jq -r '.location' input.json)

          az group create \
            --name "$RG" \
            --location "$LOCATION" \
            --tags $(jq -r '.tags | to_entries | map("\(.key)=\(.value)") | join(" ")' input.json)

          jq '{
            "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
            "contentVersion": "1.0.0.0",
            "parameters": {
              "location": {"value": .location},
              "tags": {"value": .tags},
              "vnet": {"value": .vnet},
              "subnet": {"value": .subnet},
              "vm": {"value": .vm}
            }
          }' input.json > generated.parameters.json

          az deployment group validate \
            --resource-group "$RG" \
            --template-file main.bicep \
            --parameters @generated.parameters.json

          az deployment group create \
            --name "deploy-${GITHUB_RUN_NUMBER}" \
            --resource-group "$RG" \
            --template-file main.bicep \
            --parameters @generated.parameters.json
