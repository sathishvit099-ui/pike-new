name: Bicep Lint and Validate

on:
  push:
    branches:
      - test1
    paths:
      - 'modules/**/*.bicep'
      - 'modules/*.bicep'
      - 'input.json'
      - 'bicepconfig.json'
      - '.github/workflows/bicep-lint.yml'
  pull_request:
    branches:
      - test1
    paths:
      - 'modules/**/*.bicep'
      - 'modules/*.bicep'
      - 'input.json'
      - 'bicepconfig.json'
      - '.github/workflows/bicep-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and compile Bicep modules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test1
        uses: actions/checkout@v4
        with:
          ref: test1

      - name: Validate input.json
        shell: bash
        run: |
          set -euo pipefail
          jq empty input.json
          jq -e '.environment and .location and (.landingZones | type == "object")' input.json >/dev/null
          for key in resourceGroups nsgs routeTables vnets subnets storageAccounts keyVaults vms sqlDatabases openAiServices; do
            jq -e --arg key "$key" '.landingZones[$key] | type == "array"' input.json >/dev/null
          done

      - name: Install Bicep
        run: |
          az bicep install

      - name: Lint and compile every Bicep module
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find modules -type f -name '*.bicep' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Bicep modules found."
            exit 1
          fi

          for file in "${files[@]}"; do
            echo "::group::Bicep validation: $file"
            az bicep build --file "$file" --stdout >/dev/null
            echo "PASS: $file"
            echo "::endgroup::"
          done
