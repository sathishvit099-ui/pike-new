name: Deploy Load Balancer and Application Gateway

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-lb-appgw:
    name: Deploy LB and Application Gateway (East US)
    runs-on: [self-hosted, X64, Windows]
    defaults:
      run:
        shell: pwsh
        working-directory: November Mid/pike-infra-eaas

    steps:
      - name: Checkout test1
        uses: actions/checkout@v4
        with:
          ref: test1

      - name: Validate tools and input
        run: |
          $ErrorActionPreference = "Stop"
          $azCmd = Get-Command az.cmd -ErrorAction SilentlyContinue
          if ($azCmd) { $script:az = $azCmd.Source }
          else {
            $script:az = "C:\Program Files\Microsoft SDKs\Azure\CLI2\wbin\az.cmd"
            if (-not (Test-Path $script:az)) { throw "Azure CLI not found. Install Azure CLI on the Windows runner." }
          }
          & $script:az version
          if ($LASTEXITCODE -ne 0) { throw "Azure CLI check failed." }
          & $script:az bicep install
          if ($LASTEXITCODE -ne 0) { throw "Bicep installation failed." }
          & $script:az bicep version
          if ($LASTEXITCODE -ne 0) { throw "Bicep is unavailable." }

          $cfg = Get-Content "input.json" -Raw | ConvertFrom-Json
          if ($cfg.deployment.location -ne "EastUS") { throw "This workflow is configured for EastUS only." }
          foreach ($key in @("applicationGatewaySubnets", "applicationGateways", "loadBalancers")) {
            if ($null -eq $cfg.landingZones.$key -or @($cfg.landingZones.$key).Count -eq 0) {
              throw "landingZones.$key is missing or empty."
            }
          }

          $moduleFiles = @(
            "modules/loadbalancer/lb.bicep",
            "modules/networking/applicationGatewaySubnet.bicep",
            "modules/networking/applicationGateway.bicep"
          )
          foreach ($file in $moduleFiles) {
            Write-Host "Compiling $file"
            & $script:az bicep build --file $file --stdout | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Bicep compilation failed: $file" }
          }

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify resource group and existing VNet
        run: |
          $ErrorActionPreference = "Stop"
          $cfg = Get-Content "input.json" -Raw | ConvertFrom-Json
          $rg = $cfg.landingZones.applicationGateways[0].resourceGroupName
          $vnet = $cfg.landingZones.applicationGatewaySubnets[0].vnetName
          $vnetRg = $cfg.landingZones.applicationGatewaySubnets[0].resourceGroupName
          if ($rg -ne $vnetRg) { throw "Application Gateway and VNet must be in the same resource group for this workflow." }
          & az network vnet show --resource-group $vnetRg --name $vnet --output none
          if ($LASTEXITCODE -ne 0) { throw "VNet $vnet was not found in resource group $vnetRg. Deploy the existing network foundation first." }
          & az group show --name $rg --output none
          if ($LASTEXITCODE -ne 0) { throw "Resource group $rg was not found." }

      - name: Deploy dedicated Application Gateway subnet
        run: |
          $ErrorActionPreference = "Stop"
          $cfg = Get-Content "input.json" -Raw | ConvertFrom-Json
          foreach ($x in @($cfg.landingZones.applicationGatewaySubnets)) {
            $params = @{
              '$schema' = 'https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#'
              contentVersion = '1.0.0.0'
              parameters = @{
                vnetName = @{ value = $x.vnetName }
                subnetName = @{ value = $x.subnetName }
                subnetAddressPrefix = @{ value = $x.subnetAddressPrefix }
              }
            }
            $file = Join-Path $env:RUNNER_TEMP "appgw-subnet-params.json"
            $params | ConvertTo-Json -Depth 100 | Set-Content -Path $file
            & az deployment group create --resource-group $x.resourceGroupName --name "appgw-subnet-${{ github.run_id }}" --template-file "modules/networking/applicationGatewaySubnet.bicep" --parameters "@$file"
            if ($LASTEXITCODE -ne 0) { throw "Application Gateway subnet deployment failed." }
          }

      - name: Deploy Standard Load Balancer
        run: |
          $ErrorActionPreference = "Stop"
          $cfg = Get-Content "input.json" -Raw | ConvertFrom-Json
          foreach ($x in @($cfg.landingZones.loadBalancers)) {
            $values = @{
              loadBalancerName = $x.name
              location = $x.location
              skuName = $x.skuName
              skuTier = $x.skuTier
              tags = $x.tags
              vnetName = $x.vnetName
              subnetName = $x.subnetName
              frontends = @($x.frontends)
              backendPools = @($x.backendPools)
              probes = @($x.probes)
              loadBalancingRules = @($x.loadBalancingRules)
            }
            $parameters = @{ '$schema' = 'https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#'; contentVersion = '1.0.0.0'; parameters = @{} }
            foreach ($key in $values.Keys) { $parameters.parameters[$key] = @{ value = $values[$key] } }
            $file = Join-Path $env:RUNNER_TEMP "lb-params.json"
            $parameters | ConvertTo-Json -Depth 100 | Set-Content -Path $file
            & az deployment group what-if --resource-group $x.resourceGroupName --template-file "modules/loadbalancer/lb.bicep" --parameters "@$file"
            if ($LASTEXITCODE -ne 0) { throw "Load Balancer What-If failed: $($x.name)" }
            & az deployment group create --resource-group $x.resourceGroupName --name "lb-${{ github.run_id }}" --template-file "modules/loadbalancer/lb.bicep" --parameters "@$file"
            if ($LASTEXITCODE -ne 0) { throw "Load Balancer deployment failed: $($x.name)" }
          }

      - name: Deploy Application Gateway
        run: |
          $ErrorActionPreference = "Stop"
          $cfg = Get-Content "input.json" -Raw | ConvertFrom-Json
          foreach ($x in @($cfg.landingZones.applicationGateways)) {
            $values = @{
              applicationGatewayName = $x.applicationGatewayName
              location = $x.location
              vnetName = $x.vnetName
              subnetName = $x.subnetName
              publicIpName = $x.publicIpName
              privateFrontendIp = $x.privateFrontendIp
              minCapacity = [int]$x.minCapacity
              maxCapacity = [int]$x.maxCapacity
              frontendPorts = @($x.frontendPorts)
              backendPools = @($x.backendPools)
              backendHttpSettings = @($x.backendHttpSettings)
              healthProbes = @($x.healthProbes)
              listeners = @($x.listeners)
              routingRules = @($x.routingRules)
              enableHttp2 = [bool]$x.enableHttp2
              tags = $x.tags
            }
            $parameters = @{ '$schema' = 'https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#'; contentVersion = '1.0.0.0'; parameters = @{} }
            foreach ($key in $values.Keys) { $parameters.parameters[$key] = @{ value = $values[$key] } }
            $file = Join-Path $env:RUNNER_TEMP "appgw-params.json"
            $parameters | ConvertTo-Json -Depth 100 | Set-Content -Path $file
            & az deployment group what-if --resource-group $x.resourceGroupName --template-file "modules/networking/applicationGateway.bicep" --parameters "@$file"
            if ($LASTEXITCODE -ne 0) { throw "Application Gateway What-If failed: $($x.applicationGatewayName)" }
            & az deployment group create --resource-group $x.resourceGroupName --name "appgw-${{ github.run_id }}" --template-file "modules/networking/applicationGateway.bicep" --parameters "@$file"
            if ($LASTEXITCODE -ne 0) { throw "Application Gateway deployment failed: $($x.applicationGatewayName)" }
          }
